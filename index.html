<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gigi's Favoriten</title>
<meta name="description" content="Was ich liebe & was alle wollen. Beauty-Geräte, Beauty, Fitness, Fashion, Home & Bücher.">
<meta name="theme-color" content="#efe6dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#efe6dc;--paper:#fffdfa;--ink:#161010;--muted:#6e625a;--line:#ddd0c3;--red:#d01f3c;--red-d:#a3152c;--tape:rgba(255,236,205,.82)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .caps{font-size:10.5px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase}
  .tape{position:absolute;z-index:4;width:104px;height:28px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* Cover-Polaroid */
  .hero{position:relative;padding:34px 6px 0;overflow-x:clip;margin:0 -16px;padding-left:22px;padding-right:22px}
  .polaroid{position:relative;margin:0 auto;max-width:440px;background:#fff;padding:10px 10px 0;transform:rotate(-2deg);box-shadow:0 18px 36px -14px rgba(60,20,20,.45)}
  .photo{position:relative;aspect-ratio:4/5;background:#2a1c1c center 20%/cover no-repeat}
  .polaroid .foot{height:64px}
  .tp1{left:-22px;top:-12px;transform:rotate(-30deg)} .tp2{right:-26px;top:-8px;transform:rotate(26deg)}
  .must{position:absolute;z-index:5;right:-14px;top:22px;width:92px;height:92px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;
    transform:rotate(14deg);font:900 12px/1.12 Inter;letter-spacing:1px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
  .gg{position:absolute;z-index:6;left:-8px;right:-8px;bottom:6px;text-align:center;font:400 clamp(96px,30vw,132px)/1 "Kaushan Script",cursive;color:var(--red);
    transform:rotate(-7deg);text-shadow:3px 3px 0 var(--ink)}
  .fav{text-align:center;margin:24px 0 0;font-weight:800;font-size:15px;letter-spacing:10px;padding-left:10px}
  .claim{text-align:center;margin:12px 0 0;white-space:nowrap;font:800 clamp(10px,3.05vw,13px)/1.6 Inter,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:var(--ink);padding-left:.17em}
  .claim span{color:var(--red)}

  /* Socials */
  .soc{display:flex;gap:18px;justify-content:center;margin:22px 0 0}
  .soc a{display:flex;flex-direction:column;align-items:center;gap:7px;width:86px;color:var(--ink);text-decoration:none;font-size:11px;font-weight:700;text-align:center;line-height:1.25}
  .soc .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 6px 14px -6px rgba(60,20,20,.4);transition:transform .2s}
  .soc a:nth-child(odd) .ic{transform:rotate(-6deg)} .soc a:nth-child(even) .ic{transform:rotate(6deg)}
  .soc a:active .ic{transform:scale(.94)}
  .soc .ic svg{width:24px;height:24px;fill:var(--ink)}

  /* Kategorien */
  .head{display:flex;justify-content:space-between;align-items:baseline;margin:34px 2px 12px}
  .head .red{color:var(--red)}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;padding:14px 4px 12px;background:var(--paper);border:0;
    border-radius:4px;color:var(--ink);font:700 12.5px Inter;text-align:center;cursor:pointer;box-shadow:0 6px 14px -8px rgba(60,20,20,.45)}
  .cat svg{width:28px;height:28px;fill:none;stroke:var(--red);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .cat[aria-pressed="true"] svg{stroke:#fff}
  .cat[aria-pressed="true"]{background:var(--red);color:#fff}

  /* Sticky Filterleiste */
  .bar{position:sticky;top:0;z-index:20;margin:28px -16px 0;padding:10px 16px;background:rgba(239,230,220,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font:700 12px Inter;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);padding:8px 13px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

  /* Produkte als Notizzettel */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 12px;margin-top:24px}
  .item{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--paper);padding:10px 10px 12px;box-shadow:0 10px 20px -12px rgba(60,20,20,.45)}
  .item::before{content:"";position:absolute;z-index:3;top:-9px;left:50%;width:62px;height:18px;margin-left:-31px;background:var(--tape);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .ph{position:relative;aspect-ratio:1;background:#f6efe8;display:flex;align-items:flex-end;padding:10px;overflow:hidden}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph .typo{position:relative;font:400 30px/1 "Kaushan Script",cursive;color:var(--red);transform:rotate(-4deg);transform-origin:left bottom}
  .ph .no{position:absolute;z-index:2;top:8px;left:8px;font:800 11px/1 Inter;color:#fff;background:var(--ink);padding:5px 7px;border-radius:999px}
  .item .cat-l{margin:10px 2px 0;font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--red)}
  .item h3{margin:4px 2px 4px;font-size:15px;font-weight:800;line-height:1.25}
  .item p{margin:0 2px 12px;font-size:13px;line-height:1.5;color:var(--muted);flex:1}
  .shop{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;
    font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}

  /* Gigi's Pick */
  .item.pick{grid-column:1 / -1;display:grid;grid-template-columns:46% 1fr;gap:14px;padding:12px;transform:rotate(-1.2deg)}
  .item.pick .ph{aspect-ratio:3/4}
  .item.pick .ph .typo{font-size:42px}
  .item.pick .txt{display:flex;flex-direction:column;min-width:0;padding:4px 0}
  .item.pick .lab{align-self:flex-start;font:800 10.5px/1 Inter;letter-spacing:1.8px;text-transform:uppercase;color:#fff;background:var(--red);padding:7px 10px;transform:rotate(-3deg)}
  .item.pick h3{font-size:19px;margin:14px 0 6px}
  .item.pick .cat-l{display:none}

  footer{margin:52px 0 0;padding:26px 0 44px;border-top:1.5px dashed var(--line);text-align:center;font-size:11.5px;line-height:1.65;color:var(--muted)}
  footer .sig{font:400 46px/1 "Kaushan Script",cursive;color:var(--red);transform:rotate(-5deg);display:inline-block;margin-bottom:14px;text-shadow:2px 2px 0 var(--ink)}
  footer p{margin:6px auto;max-width:380px}
  @media (min-width:600px){.bar{margin:28px 0 0;border-radius:0 0 12px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="polaroid">
      <span class="tape tp1"></span><span class="tape tp2"></span>
      <div class="photo" id="photo" role="img" aria-label="Gigi"></div>

</div>

const ok = l => typeof l === "string" && l.startsWith("http");
const nr = i => String(i + 1).padStart(2, "0");

const catsEl = document.getElementById("cats"), chips = document.getElementById("chips");

let aktiv = "Alle";

  const btn = has ? `<a class="shop" href="${esc(p.link)}" target="_blank" rel="sponsored noopener">Shop bei Amazon* ↗</a>` : "";
  const txt = (p.kachel || p.name).split("|").map(esc).join("<br>");
  const bild = p.bild ? `<img src="${esc(p.bild)}" alt="${esc(p.name)}" loading="lazy">` : `<span class="typo" aria-hidden="true">${txt}</span>`;
  const ph = `<div class="ph"><span class="no">${nr(i)}</span>${bild}</div>`;
  if (p.top && aktiv === "Alle") return `<article class="item pick">${ph}
      <div class="txt"><span class="lab">Gigi's Pick</span><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p>${btn}</div></article>`;
  return `<article class="item">${ph}<span class="cat-l">${esc(kurz(p.tag))}</span><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p>${btn}</article>`;
}
function render() {
  catsEl.innerHTML = kats.map(k => `<button class="cat" aria-pressed="${k === aktiv}" data-k="${esc(k)}"><svg viewBox="0 0 24 24" aria-hidden="true">${KI[KAT[k] ? KAT[k][0] : "buch"]}</svg>${esc(kurz(k))}</button>`).join("");
  chips.innerHTML = ["Alle", ...kats].map(k => `<button class="chip" aria-pressed="${k === aktiv}" data-k="${esc(k)}">${esc(k === "Alle" ? "Alle" : kurz(k))}</button>`).join("");
  const sel = PRODUKTE.map((p, i) => [p, i]).filter(([p]) => aktiv === "Alle" || p.tag === aktiv);
  if (aktiv === "Alle") sel.sort((a, b) => (b[0].top ? 1 : 0) - (a[0].top ? 1 : 0));
  list.innerHTML = sel.map(([p, i]) => karte(p, i)).join("");
  count.textContent = `${PRODUKTE.length} Teile`;
  const a = chips.querySelector('[aria-pressed="true"]');
  if (a) { const ar = a.getBoundingClientRect(), cr = chips.getBoundingClientRect(); chips.scrollLeft += (ar.left + ar.width / 2) - (cr.left + cr.width / 2); }
}
function waehle(k, springen) {
  aktiv = (k === aktiv && k !== "Alle") ? "Alle" : k;
  render();
  if (springen) document.getElementById("bar").scrollIntoView({ behavior: "smooth", block: "start" });
}
catsEl.addEventListener("click", e => { const b = e.target.closest(".cat"); if (b) waehle(b.dataset.k, true); });
chips.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) waehle(b.dataset.k, false); });
render();
</script>
</body>
</html>
